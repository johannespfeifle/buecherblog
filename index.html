<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bücherblog</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <main class="app-container">
    <!-- Moving Cards (Desktop) / Vertical List (Mobile) -->
    <section class="entries-panel" id="entries-panel"></section>

    <!-- Overlay Backdrop -->
    <div id="detail-backdrop" class="detail-backdrop"></div>

    <!-- Detail Side Panel (Desktop) / Slide-Up Modal (Mobile) -->
    <aside class="detail-panel" id="detail-panel">
      <button id="detail-close-btn" class="detail-close-btn" aria-label="Go back">&larr; Back</button>
      <div id="detail-content">
        <div class="default-fallback">
          <h1 class="fallback-title">Titel Blog</h1>
          <p class="fallback-intro">(Klick auf eines der Cover)</p>

          <div class="about-section">
            <p class="about-text">
              Beschreibung Blog  Beschreibung Blog Beschreibung Blog Beschreibung Blog Beschreibung Blog Beschreibung Blog Beschreibung Blog Beschreibung Blog Beschreibung Blog Beschreibung Blog Beschreibung Blog Beschreibung Blog
            </p>
          </div>

          <a class="link" href="https://www.instagram.com/" target="_blank" rel="noopener noreferrer">
            Instagram
          </a>
        </div>
      </div>
    </aside>
  </main>

  <button id="view-toggle-btn" class="view-toggle-btn" aria-label="Toggle Layout">
    <span class="btn-text">List View</span>
  </button>

  <script src="./floating.js"></script>
</body>
</html>
