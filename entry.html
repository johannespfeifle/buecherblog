<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Blog Entry</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>

  <a href="./index.html">← Back to Entries</a>

  <main id="entry-detail">
    <h1 id="entry-title">Loading...</h1>
    <p id="entry-meta"></p>
    <div id="entry-media"></div>
    <p id="entry-description"></p>
  </main>

  <script>
    async function loadEntryDetail() {
      const urlParams = new URLSearchParams(window.location.search);
      const currentSlug = urlParams.get('slug');

      if (!currentSlug) {
        window.location.href = './index.html';
        return;
      }

      const response = await fetch('./data/entries.json');
      const data = await response.json();

      const entry = data.entries.find(e => e.slug === currentSlug);

      if (!entry) {
        document.getElementById('entry-title').textContent = 'Entry Not Found';
        return;
      }

      document.title = entry.title;
      document.getElementById('entry-title').textContent = entry.title;
      document.getElementById('entry-meta').textContent = `${entry.year || ''}`;
      document.getElementById('entry-description').textContent = entry.full_description || entry.description;

      const mediaContainer = document.getElementById('entry-media');
      mediaContainer.innerHTML = `<img src="${entry.cover_image}" class="project-image">`;
    }

    loadEntryDetail();
  </script>
</body>
</html>
